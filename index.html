<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보유지분가치/시가총액 비율 대시보드</title>
<meta name="description" content="국내 지주회사의 상장 자회사 보유지분가치와 조정시가총액 비율을 추적하는 실시간 대시보드. 종목별 비율 추이·주가 차트·종목 비교를 제공한다.">
<meta property="og:title" content="보유지분가치/시가총액 비율 대시보드">
<meta property="og:description" content="국내 지주회사의 상장 자회사 보유지분가치와 조정시가총액 비율을 추적하는 실시간 대시보드. 종목별 비율 추이·주가 차트·종목 비교를 제공한다.">
<link rel="icon" type="image/svg+xml" href="icon.svg?v=1">
<script>
// iframe embed + theme: ?theme=dark|light overrides stored theme; ?embed hides chrome.
(function() {
  try {
    var params = new URLSearchParams(location.search);
    var urlTheme = params.get('theme');
    var stored = localStorage.getItem('theme');
    var theme = (urlTheme === 'dark' || urlTheme === 'light') ? urlTheme : (stored || 'light');
    document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
    var embed = params.get('embed');
    if (embed !== null && embed !== '0' && embed !== 'false') {
      document.documentElement.dataset.embed = '1';
    }
  } catch (e) {
    document.documentElement.dataset.theme = 'light';
  }
})();
</script>
<style>
/* iframe embed mode: hide standalone chrome so the dashboard fits a host frame */
html[data-embed] .header,
html[data-embed] footer { display: none !important; }
html[data-embed] .container { padding-top: 14px !important; }
</style>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="header">
  <div class="header-row">
    <div>
      <h1>보유지분가치/시가총액 비율 대시보드</h1>
      <div class="updated" id="lastUpdated"></div>
    </div>
    <div class="header-actions">
      <a class="hub-link" href="https://cantabile.tplinkdns.com:3691" rel="noopener">Value Compass ↗</a>
      <button type="button" class="refresh-btn" id="refreshBtn">새로고침</button>
      <button type="button" class="theme-toggle" id="themeToggle" title="테마 전환" aria-label="테마 전환">🌓</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="today-overview" id="todayOverview"></div>
  <div class="cards" id="cards"></div>

  <div class="chart-section featured-chart" id="ratioChartSection">
    <div class="chart-header">
      <div class="chart-header-main">
        <div class="chart-title" id="chartTitle">비율 추이</div>
        <div class="chart-legend" id="chartLegend"></div>
      </div>
      <div class="period-btns" id="periodBtns">
        <button data-days="30">1M</button>
        <button data-days="90">3M</button>
        <button data-days="180">6M</button>
        <button data-days="365">1Y</button>
        <button data-days="0" class="active">전체</button>
      </div>
      <div class="period-btns"><button type="button" id="csvExportBtn" title="표시 구간 CSV 다운로드" aria-label="표시 구간 CSV 다운로드">CSV</button></div>
    </div>
    <div class="chart-container ratio-chart-container">
      <canvas id="chart" role="img" aria-label="선택 종목의 보유지분가치/시가총액 비율 추이 선 차트"></canvas>
      <div class="tooltip" id="tooltip"></div>
    </div>
    <div class="data-zoom" id="ratioDataZoom" data-chart="ratio">
      <div class="data-zoom-track">
        <div class="data-zoom-selection" role="group" aria-label="비율 차트 표시 구간">
          <span class="data-zoom-handle left" data-handle="start" role="slider" tabindex="0" aria-label="표시 구간 시작"></span>
          <span class="data-zoom-handle right" data-handle="end" role="slider" tabindex="0" aria-label="표시 구간 끝"></span>
        </div>
      </div>
      <div class="data-zoom-labels">
        <span data-zoom-start></span>
        <span data-zoom-summary></span>
        <span data-zoom-end></span>
      </div>
    </div>
  </div>

  <div class="chart-section" id="priceChartSection">
    <div class="chart-header">
      <div class="chart-title" id="priceChartTitle">주가 추이</div>
      <div class="period-btns" id="pricePeriodBtns">
        <button data-days="30">1M</button>
        <button data-days="90">3M</button>
        <button data-days="180">6M</button>
        <button data-days="365">1Y</button>
        <button data-days="0" class="active">전체</button>
      </div>
    </div>
    <div class="chart-container price-chart-container">
      <canvas id="priceChart" role="img" aria-label="선택 지주사의 주가 추이 선 차트"></canvas>
      <div class="tooltip" id="priceTooltip"></div>
    </div>
    <div class="data-zoom" id="priceDataZoom" data-chart="price">
      <div class="data-zoom-track">
        <div class="data-zoom-selection" role="group" aria-label="주가 차트 표시 구간">
          <span class="data-zoom-handle left" data-handle="start" role="slider" tabindex="0" aria-label="표시 구간 시작"></span>
          <span class="data-zoom-handle right" data-handle="end" role="slider" tabindex="0" aria-label="표시 구간 끝"></span>
        </div>
      </div>
      <div class="data-zoom-labels">
        <span data-zoom-start></span>
        <span data-zoom-summary></span>
        <span data-zoom-end></span>
      </div>
    </div>
  </div>

  <div class="stats-row" id="statsRow"></div>

  <div class="chart-section" id="contribSection" style="display:none"></div>

  <div class="table-section">
    <h2>종목 비교</h2>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>종목</th>
            <th>지주사</th>
            <th>자회사</th>
            <th>보유지분가치</th>
            <th>조정시총</th>
            <th>현재 비율</th>
            <th>변동</th>
            <th style="min-width:120px">비율</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
window.CURRENT_DATA = window.CURRENT_DATA || null;
</script>
<!--
  스크립트 로드 순서 = 의존성 계약 (빌드 시스템 없음 — classic script 전역 함수 공유):
    1) js/format.js         포맷/이스케이프(escapeHtml)/날짜 유틸 (의존 없음)
    2) js/calc.js           순수 계산·시세 파싱·시간축 (format.js 전역 사용)
    3) js/dashboard-core.js DOM 비의존 도메인 로직 (format/calc 전역 사용)
    4) js/render.js         카드·오늘의현황·표·통계 렌더 팩토리 (1~3 전역 사용)
    5) js/charts-ui.js      캔버스 차트·dataZoom·기간버튼 팩토리 (1~3 전역 사용)
    6) js/live-ui.js        실시간 갱신·자동 새로고침 팩토리 (1~3 전역 사용)
    7) js/app-boot.js       loadDashboardData·startDashboard (4~6 팩토리 조립·배선)
  이 순서는 tests/js/structure.test.mjs가 구조 계약으로 고정한다.
-->
<script src="js/format.js"></script>
<script src="js/calc.js"></script>
<script src="js/dashboard-core.js"></script>
<script src="js/render.js"></script>
<script src="js/charts-ui.js"></script>
<script src="js/live-ui.js"></script>
<script src="js/app-boot.js"></script>
<script>
// 부트스트랩: 데이터 로드 → 대시보드 시작 (모든 로직은 js/*.js — 위 로드 순서 계약 참고)
window.__dashboardData = loadDashboardData();
window.__dashboardData.then(
  function(stockData) { startDashboard(stockData); },
  function(err) {
    document.getElementById('lastUpdated').textContent =
      '데이터 로드 실패: ' + (err && err.message ? err.message : err);
  }
);
</script>
</body>
</html>
