<meta property="og:title" content="보유지분가치/시가총액 비율 대시보드">

<script>
// iframe embed + theme: ?theme=dark|light overrides stored theme; ?embed hides chrome.
(function() {
  try {
    var params = new URLSearchParams(location.search);
    var urlTheme = params.get('theme');
    var stored = localStorage.getItem('theme');
    var theme = (urlTheme === 'dark' || urlTheme === 'light') ? urlTheme : (stored || 'light');
    document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
    var embed = params.get('embed');
    if (embed !== null && embed !== '0' && embed !== 'false') {
      document.documentElement.dataset.embed = '1';
    }
  } catch (e) {
    document.documentElement.dataset.theme = 'light';
  }
})();
</script>

html[data-embed] footer { display: none !important; }

<body>

<div class="container">
  <div class="today-overview" id="todayOverview"></div>
  <div class="cards" id="cards"></div>

  <div class="chart-section featured-chart" id="ratioChartSection">

<script>
window.CURRENT_DATA = window.CURRENT_DATA || null;
</script>
<script src="js/format.js"></script>
<script src="js/calc.js"></script>
<script src="js/dashboard-core.js"></script>
<script>
// 분할 데이터(data/summary.json + data/history/*.json 지연 로드) 우선, 실패 시 data.js 폴백.
// 첫 화면은 요약(~25KB)만으로 그리고, 차트 히스토리는 선택 종목만 받아온다.
window.__dashboardData = (function() {
  function fromSplit() {
    return fetch('data/summary.json', { cache: 'no-store' })
      .then(function(res) {
        if (!res.ok) throw new Error('summary HTTP ' + res.status);
        return res.json();
      })
      .then(function(summary) {
        if (!summary || !Array.isArray(summary.pairs) || !summary.pairs.length) {
          throw new Error('summary 비어 있음');
        }
        var pairs = summary.pairs.map(function(pair) {
          return Object.assign({}, pair, { history: [] });
        });
        return {
          lastUpdated: summary.lastUpdated,
          pairs: pairs,
          __split: true,
          __version: encodeURIComponent(summary.lastUpdated || ''),
        };
      });
  }
  function fromLegacy() {
    return new Promise(function(resolve, reject) {
      var script = document.createElement('script');
      script.src = 'data.js';
      script.onload = function() {
        if (typeof STOCK_DATA !== 'undefined') resolve(STOCK_DATA);
        else reject(new Error('STOCK_DATA 없음'));
      };
      script.onerror = function() { reject(new Error('data.js 로드 실패')); };
      document.head.appendChild(script);
    });
  }
  return fromSplit().catch(function(err) {
    console.warn('분할 데이터 로드 실패, data.js로 폴백:', err);
    return fromLegacy();
  });
})();
</script>
<script>
window.__dashboardData.then(
  function(stockData) { startDashboard(stockData); },
  function(err) {
    document.getElementById('lastUpdated').textContent =
      '데이터 로드 실패: ' + (err && err.message ? err.message : err);
  }
);

function startDashboard(STOCK_DATA) {
  window.STOCK_DATA = STOCK_DATA; // 콘솔 디버깅/외부 접근용
  const pairs = STOCK_DATA.pairs;
  const queryParams = new URLSearchParams(location.search);
  const initialCode = (queryParams.get('code') || '').trim();
  const holdingCodeById = buildHoldingCodeMapFromPairs();
  const AUTO_REFRESH_INTERVAL_MS = 300 * 1000;
  const LIVE_REFRESH_MAX_AGE_MS = 60 * 1000;
  const LIVE_REFRESH_RETRY_DELAY_MS = 1500;
  const LIVE_REFRESH_RETRY_ATTEMPTS = 3;
  const LIVE_REFRESH_FORCE_ATTEMPTS = 3;
  const LIVE_FETCH_TIMEOUT_MS = 8000;
  const LIVE_REFRESH_TIMEOUT_MS = 20000;
  const LIVE_REFRESH_FORCE_TIMEOUT_MS = 35000;
  const LIVE_PROXY_BASE_URL = 'https://cantabile.tplinkdns.com:3298';
  const LIVE_FETCH_BATCH_SIZE = 100;
  const LIVE_FETCH_BATCH_CONCURRENCY = 1;
  const LIVE_FETCH_MIN_INTERVAL_MS = 100;
  const LIVE_FETCH_RETRY_ATTEMPTS = 3;
  // LIVE_FETCH_RETRY_*_MS·MIN_ZOOM_SPAN 상수는 js/dashboard-core.js로 이동
  const PINNED_PAIRS_STORAGE_KEY = 'holdingValuePinnedPairIds';
  // 분할 히스토리 진행 중 요청 캐시 — init에서 바로 쓰므로 상단 선언 (행 필드 HISTORY_COLUMNS는 js/calc.js)
  const historyRequests = {};
  let holdingCodePromise = null;
  let holdingConfigPromise = null;
  let holdingConfigById = null;
  let hasRendered = false;
  let selectedIdx = getInitialSelectedIdx();
  let periodDays = 0; // 0 = all
  let pricePeriodDays = 0;
  const ratioZoom = createZoomState();
  const priceZoom = createZoomState();
  let refreshInFlight = false;
  let forceRefreshInFlight = false;
  let latestSnapshotVersion = getSnapshotVersion(window.CURRENT_DATA) || getSnapshotVersion(STOCK_DATA);
  let latestAppliedSnapshotMs = latestSnapshotVersion || 0;
  let lastRefreshStartedAt = 0;
  let autoRefreshTimer = null;
  let liveRefreshPromise = null;
  let nextLiveFetchAt = 0;
  let todayOverviewData = null;
  let lastRefreshError = '';
  const pinnedPairIds = loadPinnedPairIds();

  applyTheme(loadTheme(), false);

  // --- Apply live data ---
  applyCurrentData();
  sortPairsByCurrentRatio();
  todayOverviewData = buildTodaySummary();

  // --- Init ---
  // 분할 모드면 카드/표를 즉시 그리고, 평균·선택 종목 히스토리만 받아 차트를 그린다.
  updateLastUpdatedText();
  renderTodayOverview();
  renderCards();
  renderTable();
  Promise.all([
    ensureHistory(pairs.find(function(pair) { return pair.isAverage; })),
    ensureHistory(pairs[selectedIdx]),
  ]).then(function() {
    renderTodayOverview(); // 평균 스파크라인은 히스토리 하이드레이션 후 갱신
    renderChart();
    renderPriceChart();
    renderStats();
    hasRendered = true;
  });
  bindPeriodBtns();
  bindPricePeriodBtns();
  bindDataZoomControls();
  bindRefreshButton();
  bindCsvExport();
  bindThemeToggle();
  resolveSelectionFromQuery();

  // --- Auto-refresh ---
  bindAutoRefresh();
  refreshCurrentPrices();

  function applyCurrentData(snapshot) {
    const currentData = snapshot || window.CURRENT_DATA;
    if (!currentData) return false;
    const incomingVersion = getSnapshotVersion(currentData);
    if (incomingVersion && latestAppliedSnapshotMs && incomingVersion < latestAppliedSnapshotMs) {
      return false;
    }
    const currentMap = {};
    for (const p of currentData.pairs || []) {
      currentMap[p.id] = p;
    }
    const today = (currentData.lastUpdated || STOCK_DATA.lastUpdated || '').slice(0, 10);
    for (const pair of pairs) {
      const live = currentMap[pair.id];
      if (!live) continue;
      if (pair.isAverage && live.count === undefined) {
        // 구버전(단순평균) 스냅샷은 중앙값 지표·히스토리를 덮어쓰지 않고 참고값으로만 반영
        pair.current.mean = live.ratio;
        continue;
      }
      const lastHist = pair.history.length > 0 ? pair.history[pair.history.length - 1] : null;
      pair.current.ratio = live.ratio;
      pair.current.ratioChange = live.ratioChange !== undefined && live.ratioChange !== null
        ? live.ratioChange
        : lastHist ? +(live.ratio - lastHist.ratio).toFixed(2) : 0;
      if (pair.isAverage) {
        if (live.count !== undefined) pair.current.count = live.count;
        if (live.mean !== undefined) pair.current.mean = live.mean;
      }
      if (!pair.isAverage) {
        pair.current.holdingPrice = live.holdingPrice;
        if (live.holdingChange !== undefined) {
          pair.current.holdingChange = live.holdingChange;
        }
        pair.current.holdingValue = live.holdingValue;
        pair.current.marketCap = live.marketCap;
        if (live.subsidiaryPrice !== undefined) {
          pair.current.subsidiaryPrice = live.subsidiaryPrice;
        }
        if (live.subsidiaryChange !== undefined) {
          pair.current.subsidiaryChange = live.subsidiaryChange;
        }
        if (live.subsidiaries) {
          pair.current.subsidiaries = live.subsidiaries;
        }
      }
      upsertTodayHistory(pair, live, today);
    }
    if (currentData.lastUpdated) {
      STOCK_DATA.lastUpdated = currentData.lastUpdated;
    }
    window.CURRENT_DATA = currentData;
    latestAppliedSnapshotMs = incomingVersion || Date.now();
    latestSnapshotVersion = Math.max(latestSnapshotVersion || 0, latestAppliedSnapshotMs || 0);
    todayOverviewData = buildTodaySummary(currentData);
    return true;
  }

  // --- 분할 히스토리 지연 로드 ---
  function ensureHistory(pair) {
    if (!pair || !STOCK_DATA.__split || (pair.history && pair.history.length)) {
      return Promise.resolve(pair);
    }
    if (historyRequests[pair.id]) return historyRequests[pair.id];
    historyRequests[pair.id] = fetch('data/history/' + encodeURIComponent(pair.id) + '.json?v=' + STOCK_DATA.__version)
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(columnar) {
        pair.history = rowsFromColumnar(columnar);
        applyLiveToHistory(pair);
        return pair;
      })
      .catch(function(err) {
        delete historyRequests[pair.id];
        console.warn('히스토리 로드 실패: ' + pair.id, err);
        return pair;
      });
    return historyRequests[pair.id];
  }

  // 늦게 하이드레이션된 히스토리에 최신 스냅샷의 오늘 포인트를 반영
  function applyLiveToHistory(pair) {
    const snapshot = window.CURRENT_DATA;
    if (!snapshot || !Array.isArray(snapshot.pairs)) return;
    const live = snapshot.pairs.find(function(entry) { return entry.id === pair.id; });
    if (!live) return;
    if (pair.isAverage && live.count === undefined) return; // 구버전(단순평균) 스냅샷 제외
    const today = (snapshot.lastUpdated || STOCK_DATA.lastUpdated || '').slice(0, 10);
    upsertTodayHistory(pair, live, today);
  }

  async function loadCurrentSnapshotFile() {
    try {
      const res = await fetch('current.json?t=' + Date.now(), { cache: 'no-store' });
      if (res.ok) return await res.json();
    } catch (err) {
      console.warn('current.json 로드 실패:', err);
    }
    return null;
  }

  async function refreshCurrentPrices(opts) {
    opts = opts || {};
    const forceLiveRefresh = !!(opts.manual || opts.forceLiveRefresh);

    if (!forceLiveRefresh && document.visibilityState !== 'visible') {
      return false;
    }
    if (refreshInFlight) {
      return false;
    }

    refreshInFlight = true;
    forceRefreshInFlight = forceLiveRefresh;
    lastRefreshStartedAt = Date.now();
    updateRefreshButton();

    try {
      let baseSnapshot = {
        lastUpdated: STOCK_DATA.lastUpdated,
        snapshotTimestamp: latestAppliedSnapshotMs || getSnapshotVersion(STOCK_DATA),
      };

      const nextSnapshot = await loadCurrentSnapshotFile();
      if (nextSnapshot && applyCurrentData(nextSnapshot)) {
        baseSnapshot = nextSnapshot;
      }

      const refreshed = await refreshLivePricesWithRetry(
        baseSnapshot,
        forceLiveRefresh ? LIVE_REFRESH_FORCE_ATTEMPTS : LIVE_REFRESH_RETRY_ATTEMPTS,
        { forceRefresh: forceLiveRefresh },
      );
      if (forceLiveRefresh && !refreshed) {
        throw new Error('현재가를 새로 받지 못했습니다 (프록시/네트워크 확인)');
      }

      lastRefreshError = '';
      renderAll();
      return true;
    } catch (err) {
      console.warn('현재가 갱신 실패:', err);
      if (forceLiveRefresh) {
        lastRefreshError = err && err.message ? err.message : '현재가 갱신 실패';
        renderAll();
      }
      return false;
    } finally {
      refreshInFlight = false;
      forceRefreshInFlight = false;
      updateRefreshButton();
    }
  }

  function scheduleAutoRefresh(delayMs) {
    const nextDelay = delayMs == null ? AUTO_REFRESH_INTERVAL_MS : delayMs;
    if (autoRefreshTimer) {
      clearTimeout(autoRefreshTimer);
    }
    autoRefreshTimer = setTimeout(function() {
      if (document.visibilityState !== 'visible') {
        scheduleAutoRefresh(AUTO_REFRESH_INTERVAL_MS);
        return;
      }
      refreshCurrentPrices().finally(function() {
        scheduleAutoRefresh(AUTO_REFRESH_INTERVAL_MS);
      });
    }, nextDelay);
  }

  function bindAutoRefresh() {
    scheduleAutoRefresh();

    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState !== 'visible') return;
      const elapsed = Date.now() - lastRefreshStartedAt;
      if (!lastRefreshStartedAt || elapsed >= AUTO_REFRESH_INTERVAL_MS) {
        refreshCurrentPrices();
      } else {
        scheduleAutoRefresh(Math.max(1000, AUTO_REFRESH_INTERVAL_MS - elapsed));
      }
    });
  }

  function bindRefreshButton() {
    var button = document.getElementById('refreshBtn');
    if (!button) return;
    button.addEventListener('click', function() {
      refreshCurrentPrices({ forceLiveRefresh: true });
    });
    updateRefreshButton();
  }

  function updateRefreshButton() {
    var button = document.getElementById('refreshBtn');
    if (!button) return;
    button.disabled = refreshInFlight;
    button.classList.toggle('is-refreshing', refreshInFlight);
    button.textContent = refreshInFlight
      ? forceRefreshInFlight ? '전체 현재가 갱신 중...' : '새로고침 중...'
      : '새로고침';
  }

  // escapeCsvValue는 js/dashboard-core.js로 이동

  function bindCsvExport() {
    var button = document.getElementById('csvExportBtn');
    if (!button) return;
    button.addEventListener('click', function() {
      const pair = pairs[selectedIdx];
      if (!pair) return;
      const hist = getFilteredHistory(pair);
      if (!hist.length) return;

      const columns = ['date', 'holdingPrice', 'subsidiaryPrice', 'holdingValue', 'marketCap', 'ratio', 'sma250', 'ema01'];
      if (pair.isAverage) {
        columns.push('mean', 'count');
      }
      const lastEntry = hist[hist.length - 1];
      const subNames = Array.isArray(lastEntry.subsidiaries)
        ? lastEntry.subsidiaries.map(function(sub) { return sub.name; })
        : [];

      const header = columns.slice();
      subNames.forEach(function(name) {
        header.push(name + ' price', name + ' ratio');
      });
      const lines = [header.map(escapeCsvValue).join(',')];
      hist.forEach(function(entry) {
        const row = columns.map(function(key) { return escapeCsvValue(entry[key]); });
        subNames.forEach(function(name) {
          const sub = Array.isArray(entry.subsidiaries)
            ? entry.subsidiaries.find(function(item) { return item.name === name; })
            : null;
          row.push(escapeCsvValue(sub ? sub.price : null), escapeCsvValue(sub ? sub.ratio : null));
        });
        lines.push(row.join(','));
      });

      const blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = pair.id + '_' + hist[0].date + '_' + lastEntry.date + '.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    });
  }

  function updateLastUpdatedText() {
    var parts = ['최종 업데이트: ' + STOCK_DATA.lastUpdated];
    if (window.CURRENT_DATA && window.CURRENT_DATA.isPartial) {
      var preserved = (window.CURRENT_DATA.preservedPairIds || []).length;
      var missing = (window.CURRENT_DATA.missingPairIds || []).length;
      if (preserved > 0) {
        parts.push('일부 종목은 직전 정상값 유지');
      }
      if (missing > 0) {
        parts.push('미반영 종목 ' + missing + '개');
      }
    }
    if (lastRefreshError) {
      parts.push('새로고침 실패: ' + lastRefreshError);
    }
    document.getElementById('lastUpdated').textContent = parts.join(' · ');
  }

  // getSnapshotVersion은 js/dashboard-core.js로 이동

  function sortPairsByCurrentRatio() {
    var selectedPairId = pairs[selectedIdx] ? pairs[selectedIdx].id : '';
    // 정렬 비교자(comparePairOrder)는 js/dashboard-core.js — 즐겨찾기 판별 함수를 주입한다.
    pairs.sort(function(a, b) { return comparePairOrder(a, b, isPairPinned); });
    if (!selectedPairId) return;
    var nextIdx = pairs.findIndex(function(pair) {
      return pair.id === selectedPairId;
    });
    if (nextIdx >= 0) {
      selectedIdx = nextIdx;
    }
  }

  function loadPinnedPairIds() {
    try {
      var parsed = JSON.parse(localStorage.getItem(PINNED_PAIRS_STORAGE_KEY) || '[]');
      return new Set(Array.isArray(parsed) ? parsed.filter(function(id) {
        return typeof id === 'string';
      }) : []);
    } catch (e) {
      return new Set();
    }
  }

  function savePinnedPairIds() {
    try {
      localStorage.setItem(PINNED_PAIRS_STORAGE_KEY, JSON.stringify(Array.from(pinnedPairIds)));
    } catch (e) {

  function renderAverageSparkline() {
    const avgPair = pairs.find(function(pair) { return pair.isAverage; });
    const history = (avgPair?.history || [])
      .filter(function(row) { return typeof row.ratio === 'number' && Number.isFinite(row.ratio); })
      .slice(-18);
    if (history.length < 2) {
      return `<div class="average-sparkline empty">추이 데이터 대기</div>`;
    }

    const width = 128;
    const height = 56;
    const pad = 4;
    const values = history.map(function(row) { return row.ratio; });
    const min = Math.min(...values);
    const max = Math.max(...values);
    const span = max - min || 1;
    const points = values.map(function(value, idx) {
      const x = pad + (idx / (values.length - 1)) * (width - pad * 2);
      const y = pad + (1 - (value - min) / span) * (height - pad * 2);
      return [x.toFixed(1), y.toFixed(1)];
    });
    const line = points.map(function(point) { return point.join(','); }).join(' ');
    const area = [
      `${pad},${height - pad}`,
      line,
      `${width - pad},${height - pad}`,
    ].join(' ');
    const direction = values[values.length - 1] - values[0];
    const dir = getDirectionClass(direction);
    return `<div class="average-sparkline ${dir}">
      <div class="average-sparkline-label">최근 ${history.length}개 관측치</div>
      <svg viewBox="0 0 ${width} ${height}" aria-hidden="true">
        <polygon class="average-sparkline-fill" points="${area}"></polygon>
        <polyline class="average-sparkline-line" points="${line}"></polyline>
      </svg>
    </div>`;
  }

  function isSnapshotMsStale(snapshotMs) {
    return !snapshotMs || Date.now() - snapshotMs > LIVE_REFRESH_MAX_AGE_MS;
  }

  function delay(ms) {
    return new Promise(function(resolve) { setTimeout(resolve, ms); });
  }

  function withCacheBustingParam(url) {
    return url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
  }

  function buildLiveProxyUrl(path) {
    return LIVE_PROXY_BASE_URL.replace(/\/$/, '') + path;
  }

  function shouldBypassCacheBuster(url) {
    return url.indexOf(LIVE_PROXY_BASE_URL.replace(/\/$/, '')) === 0;
  }

  async function waitForLiveFetchSlot() {
    const now = Date.now();
    const scheduledAt = Math.max(now, nextLiveFetchAt);
    nextLiveFetchAt = scheduledAt + LIVE_FETCH_MIN_INTERVAL_MS;
    const waitMs = scheduledAt - now;
    if (waitMs > 0) await delay(waitMs);
  }

  // parseRetryAfterMs·isRetryableLiveFetchError·getLiveFetchRetryDelayMs는 js/dashboard-core.js로 이동

  async function fetchWithTimeout(url, responseType, timeoutMs) {
    const controller = new AbortController();
    const timer = setTimeout(function() { controller.abort(); }, timeoutMs || LIVE_FETCH_TIMEOUT_MS);
    try {
      await waitForLiveFetchSlot();
      const requestUrl = shouldBypassCacheBuster(url) ? url : withCacheBustingParam(url);
      const resp = await fetch(requestUrl, {
        signal: controller.signal,
        cache: 'no-store',
      });
      if (!resp.ok) {
        const err = new Error('HTTP ' + resp.status);
        err.status = resp.status;
        err.retryAfter = resp.headers.get('Retry-After');
        try {
          err.body = (await resp.text()).slice(0, 200);
        } catch (bodyErr) {}
        throw err;
      }
      return responseType === 'text' ? await resp.text() : await resp.json();
    } finally {
      clearTimeout(timer);
    }
  }

  async function runWithTimeout(task, timeoutMs, errorMessage) {
    let timer = null;
    try {
      return await Promise.race([
        task,
        new Promise(function(_, reject) {
          timer = setTimeout(function() { reject(new Error(errorMessage)); }, timeoutMs);
        }),
      ]);
    } finally {
      clearTimeout(timer);
    }
  }

  async function fetchLiveJson(url, timeoutMs) {
    for (let attempt = 0; attempt < LIVE_FETCH_RETRY_ATTEMPTS; attempt += 1) {
      try {
        return await fetchWithTimeout(url, 'json', timeoutMs || LIVE_FETCH_TIMEOUT_MS);
      } catch (err) {
        if (attempt >= LIVE_FETCH_RETRY_ATTEMPTS - 1 || !isRetryableLiveFetchError(err)) {
          throw err;
        }
        await delay(getLiveFetchRetryDelayMs(err, attempt));
      }
    }
    return null;
  }

  async function mapWithConcurrency(items, limit, mapper) {
    const results = new Array(items.length);
    let nextIndex = 0;

    async function worker() {
      while (true) {
        const idx = nextIndex;
        nextIndex += 1;
        if (idx >= items.length) return;
        try {
          results[idx] = await mapper(items[idx], idx);
        } catch (err) {
          results[idx] = [];
        }
      }
    }

    await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
    return results;
  }

  async function fetchLiveStockQuoteMap(codes) {
    const uniqueCodes = [...new Set(codes.filter(Boolean))];
    if (!uniqueCodes.length) return new Map();

    async function fetchQuoteBatch(batchCodes) {
      const payload = await fetchLiveJson(
        buildLiveProxyUrl('/v1/naverfinance/stocks/quotes?symbols=' + encodeURIComponent(batchCodes.join(','))),
      );
      if (Array.isArray(payload?.items)) {
        return payload.items.map(function(item) {
          return {
            code: String(item.symbol || item.summary?.symbol || item.raw?.cd || '').trim(),
            quote: parseProxyQuote(item),
          };
        });
      }
      if (payload?.summary || payload?.raw) {
        return [{
          code: String(payload.symbol || payload.summary?.symbol || payload.raw?.cd || batchCodes[0] || '').trim(),
          quote: parseProxyQuote(payload),
        }];
      }
      return [];
    }

    const batchResults = await mapWithConcurrency(
      chunkArray(uniqueCodes, LIVE_FETCH_BATCH_SIZE),
      LIVE_FETCH_BATCH_CONCURRENCY,
      function(batchCodes) {
        return fetchQuoteBatch(batchCodes);
      },
    );

    return new Map(
      batchResults
        .flat()
        .filter(function(result) {
          return result && result.code && result.quote && result.quote.price != null;
        })
        .map(function(result) { return [result.code, result.quote]; }),
    );
  }

  async function loadHoldingConfigMap() {
    if (holdingConfigPromise) return holdingConfigPromise;
    holdingConfigPromise = fetch('config.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(config) {
        holdingConfigById = new Map();
        config.forEach(function(entry) {
          if (!entry.id) return;
          holdingConfigById.set(entry.id, entry);
          if (entry.holdingTicker) {
            holdingCodeById[entry.id] = getTickerCode(entry.holdingTicker);
          }
        });
        return holdingConfigById;
      });
    return holdingConfigPromise;
  }

  async function buildLiveSnapshot() {
    const configMap = await loadHoldingConfigMap();
    const codes = [];
    pairs.filter(function(pair) { return !pair.isAverage; }).forEach(function(pair) {
      const config = configMap.get(pair.id);
      if (!config) return;
      if (isKoreanTicker(config.holdingTicker)) codes.push(getTickerCode(config.holdingTicker));
      (config.subsidiaries || []).forEach(function(sub) {
        if (isKoreanTicker(sub.ticker)) codes.push(getTickerCode(sub.ticker));
      });
    });

    const uniqueCodes = [...new Set(codes.filter(Boolean))];
    const [quoteMap, market] = await Promise.all([
      fetchLiveStockQuoteMap(uniqueCodes),
      buildLiveMarketSummary().catch(function() { return null; }),
    ]);
    // 부분 성공 허용: 받은 종목만 갱신하고 누락 종목은 직전 값을 유지한다.
    // (서버 스냅샷의 isPartial/missingPairIds 계약과 동일 — 전부-아니면-실패 제거)
    const livePairs = [];
    const missingPairIds = [];
    pairs.filter(function(pair) { return !pair.isAverage; }).forEach(function(pair) {
      const config = configMap.get(pair.id);
      const entry = config ? buildLivePairEntry(pair, config, quoteMap) : null;
      if (entry) livePairs.push(entry);
      else missingPairIds.push(pair.id);
    });
    if (!livePairs.length) throw new Error('현재가를 하나도 받지 못했습니다 (프록시/네트워크 확인)');

    // 전체 지표는 라이브 + 누락 종목의 직전 값까지 합친 전체 구성 기준으로 계산
    const liveIds = new Set(livePairs.map(function(entry) { return entry.id; }));
    const ratioValues = livePairs.map(function(pair) { return pair.ratio; });
    const changeValues = livePairs
      .map(function(pair) { return pair.ratioChange; })
      .filter(function(value) { return typeof value === 'number' && Number.isFinite(value); });
    pairs.forEach(function(pair) {
      if (pair.isAverage || liveIds.has(pair.id)) return;
      if (typeof pair.current.ratio === 'number' && Number.isFinite(pair.current.ratio)) {
        ratioValues.push(pair.current.ratio);
      }
      if (typeof pair.current.ratioChange === 'number' && Number.isFinite(pair.current.ratioChange)) {
        changeValues.push(pair.current.ratioChange);
      }
    });
    const medianRatio = medianOf(ratioValues);
    const meanRatio = ratioValues.reduce(function(sum, v) { return sum + v; }, 0) / ratioValues.length;
    const medianChange = changeValues.length ? medianOf(changeValues) : null;
    livePairs.push({
      id: '_average',
      ratio: +medianRatio.toFixed(2),
      mean: +meanRatio.toFixed(2),
      count: ratioValues.length,
      ratioChange: medianChange == null ? null : +medianChange.toFixed(2),
      quoteSource: 'derived',
    });
    const now = new Date();
    return {
      source: '내부 프록시 실시간',
      lastUpdated: formatKstTimestamp(now),
      generatedAt: now.toISOString(),
      snapshotTimestamp: Date.now(),
      isPartial: missingPairIds.length > 0,
      missingPairIds: missingPairIds,
      preservedPairIds: [],
      market,
      pairs: livePairs,
    };
  }

  async function buildLiveMarketSummary() {
    const [kospiPayload, kosdaqPayload] = await Promise.all([
      fetchLiveJson(buildLiveProxyUrl('/v1/indexes/KOSPI/quote')),
      fetchLiveJson(buildLiveProxyUrl('/v1/indexes/KOSDAQ/quote')).catch(function() { return null; }),
    ]);
    const kospi = buildProxyMarketMetric(kospiPayload, { id: 'KOSPI', name: 'KOSPI', priceDecimals: 2 });
    const kosdaq = buildProxyMarketMetric(kosdaqPayload, { id: 'KOSDAQ', name: 'KOSDAQ', priceDecimals: 2 });
    if (!kospi) return null;
    if (kosdaq) kospi.extras = [kosdaq];
    return kospi;
  }

  // buildLivePairEntry(실시간 시세+스냅샷 폴백 병합)는 js/dashboard-core.js로 이동

  async function refreshLivePricesIfNeeded(baseSnapshot, opts) {
    opts = opts || {};
    const baseSnapshotMs = getSnapshotVersion(baseSnapshot);
    const referenceSnapshotMs = Math.max(baseSnapshotMs || 0, latestAppliedSnapshotMs || 0);
    if (!opts.forceRefresh && !isSnapshotMsStale(referenceSnapshotMs)) return false;
    if (liveRefreshPromise) return liveRefreshPromise;

    liveRefreshPromise = (async function() {
      try {
        const liveSnapshot = await runWithTimeout(
          buildLiveSnapshot(),
          opts.forceRefresh ? LIVE_REFRESH_FORCE_TIMEOUT_MS : LIVE_REFRESH_TIMEOUT_MS,
          '실시간 갱신 시간이 초과되었습니다.',
        );
        return applyCurrentData(liveSnapshot);
      } catch (err) {
        console.warn('브라우저 실시간 갱신 실패:', err);
        return false;
      } finally {
        liveRefreshPromise = null;
      }
    })();
    return liveRefreshPromise;
  }

  async function refreshLivePricesWithRetry(baseSnapshot, attempts, opts) {
    for (let attempt = 0; attempt < attempts; attempt += 1) {
      const refreshed = await refreshLivePricesIfNeeded(baseSnapshot, opts);
      if (refreshed || (!opts?.forceRefresh && !isSnapshotMsStale(latestAppliedSnapshotMs || 0))) {
        return refreshed;
      }
      if (attempt < attempts - 1) await delay(LIVE_REFRESH_RETRY_DELAY_MS);
    }
    return false;
  }

          <span class="amount-label">조정시총</span><span class="amount-value">${formatOk(c.marketCap)}</span>
          ${pctileRow}
        </div>`;
      }
      const pinned = isPairPinned(p);
      const pinButton = p.isAverage ? '' : `<button type="button" class="card-pin${pinned ? ' pinned' : ''}" data-pin-idx="${i}" aria-label="관심종목 ${pinned ? '해제' : '등록'}" aria-pressed="${pinned}">${pinned ? '★' : '☆'}</button>`;
      return `<div class="card${i === selectedIdx ? ' active' : ''}${p.isAverage ? ' avg-card' : ''}" data-idx="${i}" role="button" tabindex="0" aria-pressed="${i === selectedIdx}">
        ${pinButton}
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="ratio-line">
          <div class="ratio-val">${formatRatio(c.ratio)}</div>
          <div class="ratio-change ${dir}">${formatSignedPoints(c.ratioChange)}</div>
        </div>
        ${prices}
      </div>`;
    }).join('');
    el.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => {
        setSelectedIdx(parseInt(card.dataset.idx), { syncUrl: true });
      });
      // 키보드 접근: role="button" 카드에서 Enter/Space로 선택 (내부 핀 버튼 키 입력은 제외)
      card.addEventListener('keydown', event => {
        if (event.target !== card) return;
        if (event.key !== 'Enter' && event.key !== ' ') return;
        event.preventDefault();
        const idx = parseInt(card.dataset.idx);
        setSelectedIdx(idx, { syncUrl: true });
        // 재렌더로 기존 노드가 사라지므로 같은 카드에 포커스 복원
        const next = el.querySelector('.card[data-idx="' + idx + '"]');
        if (next) next.focus();
      });
    });
    el.querySelectorAll('.card-pin').forEach(button => {
      button.addEventListener('click', event => {
        event.stopPropagation();
        togglePinnedPair(parseInt(button.dataset.pinIdx, 10));
      });
    });
  }

  // --- Stats ---
  function renderStats() {
    const p = pairs[selectedIdx];
    const hist = getFilteredHistory(p);
    if (!hist.length) {
      document.getElementById('statsRow').innerHTML = '';
      const contribSection = document.getElementById('contribSection');
      if (contribSection) contribSection.style.display = 'none';
      return;
    }
    const current = p.current.ratio;
    // 최소/최대/평균/백분위/Z-score 계산은 js/dashboard-core.js(computeRatioStats)
    const { min, max, avg, percentile, zScore } = computeRatioStats(hist.map(h => h.ratio), current);

    const statsEl = document.getElementById('statsRow');
    statsEl.innerHTML = `
      <div class="stat-box"><div class="label">현재 비율</div><div class="value">${current.toFixed(2)}%</div></div>
      <div class="stat-box"><div class="label">평균</div><div class="value">${avg.toFixed(2)}%</div></div>
      <div class="stat-box"><div class="label">최저</div><div class="value">${min.toFixed(2)}%</div></div>
      <div class="stat-box"><div class="label">최고</div><div class="value">${max.toFixed(2)}%</div></div>
      <div class="stat-box"><div class="label">백분위</div><div class="value">${percentile}%</div></div>
      <div class="stat-box"><div class="label">Z-SCORE (구간)</div><div class="value">${zScore === null ? '-' : (zScore > 0 ? '+' : '') + zScore.toFixed(2)}</div></div>
      <div class="stat-box"><div class="label">데이터 수</div><div class="value">${hist.length}일</div></div>
    `;

  // --- 자회사 기여 분해 ---
  function renderContribution() {
    const section = document.getElementById('contribSection');
    if (!section) return;
    const p = pairs[selectedIdx];
    const hist = getFilteredHistory(p);
    // 기여 분해 행 계산은 js/dashboard-core.js(buildContributionRows)
    const contribution = p.isAverage ? null : buildContributionRows(hist);
    if (!contribution) {
      section.style.display = 'none';
      return;
    }

    const rows = contribution.rows;
    const maxAbs = contribution.maxAbs;
    const totalDelta = contribution.totalDelta;
    const last = hist[hist.length - 1];
    const formatDelta = (v) => (v > 0 ? '+' : '') + v.toFixed(1) + '%p';

    const rowsHtml = rows.map(function(row) {
      const barWidth = (Math.abs(row.delta) / maxAbs * 100).toFixed(1);
      const barColor = row.delta >= 0 ? 'var(--up)' : 'var(--down)';
      return `<div class="contrib-row">
        <span class="contrib-name">${escapeHtml(row.name)}</span>
        <span class="contrib-span">${row.first.toFixed(1)}% → ${row.last.toFixed(1)}%</span>
        <span class="contrib-delta ${getDirectionClass(row.delta)}-color">${formatDelta(row.delta)}</span>
        <div class="contrib-bar-track"><div class="contrib-bar" style="width:${barWidth}%;background:${barColor}"></div></div>
      </div>`;
    }).join('');

    // 자회사 Δ는 총 비율과 같은 분모(지주 조정시총)를 쓰므로 Σd ≈ totalDelta (반올림 차이만) — 잔차 행 불필요
    section.innerHTML = `
      <div class="contrib-head">
        <div class="contrib-title">자회사 기여 분해</div>
        <div class="contrib-range">${hist[0].date} → ${last.date}</div>
      </div>
      <div>
        ${rowsHtml}
        <div class="contrib-row contrib-total">
          <span class="contrib-name">합계 (지주가 변동 포함)</span>
          <span class="contrib-span">${hist[0].ratio}% → ${last.ratio}%</span>
          <span class="contrib-delta ${getDirectionClass(totalDelta)}-color">${formatDelta(totalDelta)}</span>
          <span></span>
        </div>
      </div>`;
    section.style.display = '';
  }

  // --- Chart ---
  function renderChart() {
    const p = pairs[selectedIdx];
    document.getElementById('chartTitle').textContent = p.name + ' 비율 추이';
    const legendEl = document.getElementById('chartLegend');

    const canvas = document.getElementById('chart');
    canvas.setAttribute('aria-label', p.name + '의 보유지분가치/시가총액 비율 추이 선 차트');
    const container = canvas.parentElement;
    const dpr = window.devicePixelRatio || 1;
    const rect = container.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';

    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    const W = rect.width;
    const H = rect.height;

    const baseHist = filterHistoryByDays(p.history, periodDays);
    updateDataZoom('ratio', baseHist, ratioZoom);
    const hist = applyZoomToHistory(baseHist, ratioZoom);
    if (hist.length < 2) {
      ctx.clearRect(0, 0, W, H); // 하이드레이션 대기 중 직전 종목 차트 잔상 제거
      renderChartLegend([], legendEl);
      return;
    }

    const stackedSubs = getStackedSubsidiarySeries(hist);
    const ratios = hist.map(h => h.ratio);
    const trendLines = buildRatioTrendLines(p.history, hist);
    const trendValues = [trendLines.sma.values, trendLines.ema.values]
      .flat()
      .filter(function(value) { return value !== null; });
    const rangeValues = ratios.concat(trendValues);
    const maxS = Math.max(...rangeValues);
    const isStacked = stackedSubs.length > 1;
    const minS = isStacked ? 0 : Math.min(...rangeValues);
    const dataSpan = Math.max(maxS - minS, 1);
    const include100 = 100 >= minS - dataSpan * 0.5 && 100 <= maxS + dataSpan * 0.5;
    const chartPadding = Math.max(maxS - minS, 1) * 0.05;
    const chartMin = (isStacked ? 0 : (include100 ? Math.min(minS, 100) : minS) - chartPadding);
    const chartMax = (include100 ? Math.max(maxS, 100) : maxS) + chartPadding;
    const rangeS = chartMax - chartMin || 1;
    const avg = ratios.reduce((a, b) => a + b, 0) / ratios.length;

    const pad = { top: 20, right: 16, bottom: 36, left: 64 };
    const cW = W - pad.left - pad.right;
    const cH = H - pad.top - pad.bottom;
    const xs = buildTimeScale(hist, pad.left, cW);
    const colors = getThemeColors();
    const palette = getStackPalette();
    const legendItems = buildChartLegendItems(stackedSubs, palette, colors);

    // Clear
    ctx.clearRect(0, 0, W, H);
    renderChartLegend(legendItems, legendEl);

    // Y axis grid
    ctx.strokeStyle = colors.grid;
    ctx.lineWidth = 1;
    const yTicks = 5;
    ctx.font = '12px -apple-system, sans-serif';
    ctx.fillStyle = colors.textDim;
    ctx.textAlign = 'right';
    for (let i = 0; i <= yTicks; i++) {
      const v = chartMin + (rangeS * i / yTicks);
      const y = pad.top + cH - (cH * i / yTicks);
      ctx.beginPath();
      ctx.moveTo(pad.left, y);
      ctx.lineTo(W - pad.right, y);
      ctx.stroke();
      ctx.fillText(v.toFixed(1) + '%', pad.left - 8, y + 4);
    }

    // ±σ 밴드 (단일 라인 차트 전용) — 평균선/SMA/EMA/데이터 라인보다 먼저 그려 밴드가 바닥에 깔리게 한다
    if (!isStacked) {
      const variance = ratios.reduce((s, r) => s + (r - avg) * (r - avg), 0) / ratios.length;
      const sd = Math.sqrt(variance);
      if (sd > 0) {
        ctx.save();
        const bandTop = Math.max(pad.top, pad.top + cH - ((avg + sd - chartMin) / rangeS * cH));
        const bandBottom = Math.min(pad.top + cH, pad.top + cH - ((avg - sd - chartMin) / rangeS * cH));
        if (bandBottom > bandTop) {
          ctx.fillStyle = withAlpha(colors.accent, 0.08);
          ctx.fillRect(pad.left, bandTop, cW, bandBottom - bandTop);
        }
        ctx.font = '11px -apple-system, sans-serif';
        [
          { value: avg + sd * 2, label: '+2σ' },
          { value: avg - sd * 2, label: '−2σ' },
        ].forEach(function(sigma) {
          if (sigma.value < chartMin || sigma.value > chartMax) return;
          const y = pad.top + cH - ((sigma.value - chartMin) / rangeS * cH);
          ctx.strokeStyle = withAlpha(colors.accent, 0.45);
          ctx.lineWidth = 1;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.moveTo(pad.left, y);
          ctx.lineTo(W - pad.right, y);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = colors.textDim;
          ctx.textAlign = 'right';
          ctx.fillText(sigma.label, W - pad.right - 4, y - 4);
        });
        ctx.restore();
      }
    }

    // 100% reference line
    if (100 >= chartMin && 100 <= chartMax) {
      const refY = pad.top + cH - ((100 - chartMin) / rangeS * cH);
      ctx.strokeStyle = colors.warnLine;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(pad.left, refY);
      ctx.lineTo(W - pad.right, refY);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = colors.warnText;
      ctx.textAlign = 'left';
      ctx.fillText('100%', W - pad.right - 40, refY - 6);
    }

    // Average line
    const avgY = pad.top + cH - ((avg - chartMin) / rangeS * cH);
    ctx.strokeStyle = colors.avgLine;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(pad.left, avgY);
    ctx.lineTo(W - pad.right, avgY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = colors.avgText;
    ctx.textAlign = 'left';
    ctx.fillText('평균 ' + avg.toFixed(1) + '%', pad.left + 4, avgY - 6);

    // X axis labels (시간 위치 기준)
    ctx.fillStyle = colors.textDim;
    ctx.textAlign = 'center';
    drawTimeAxisLabels(ctx, hist, xs, pad.left, cW, H - pad.bottom + 20);

    if (isStacked) {
      drawStackedRatioChart(ctx, hist, xs, stackedSubs, palette, colors, pad, cW, cH, chartMin, rangeS);
    } else {
      drawSingleRatioChart(ctx, hist, xs, colors, pad, cW, cH, chartMin, rangeS);
    }

    drawTrendLine(ctx, hist, xs, trendLines.sma.values, colors.smaLine, pad, cH, chartMin, rangeS, [10, 6], 2);
    drawTrendLine(ctx, hist, xs, trendLines.ema.values, colors.emaLine, pad, cH, chartMin, rangeS, [], 2);

    // Tooltip interaction
    const tooltip = document.getElementById('tooltip');
    canvas.onpointermove = function(e) {
      const r = canvas.getBoundingClientRect();
      const mx = e.clientX - r.left;
      const my = e.clientY - r.top;
      if (mx < pad.left || mx > W - pad.right || my < pad.top || my > pad.top + cH) {
        tooltip.classList.remove('visible');
        return;
      }
      const idx = nearestIndexForX(xs, mx);
      const d = hist[idx];
      if (!d) return;

      const dotX = xs[idx];
      const dotY = pad.top + cH - ((d.ratio - chartMin) / rangeS * cH);

      let ttRows;
      if (p.isAverage) {
        ttRows = `<div class="tt-row"><span><strong>비율</strong></span><span><strong>${d.ratio.toFixed(2)}%</strong></span></div>`;
        if (typeof d.count === 'number') {
          ttRows += `<div class="tt-row"><span>구성 종목</span><span>${d.count}개</span></div>`;
        }
      } else if (Array.isArray(d.subsidiaries) && d.subsidiaries.length > 1) {
        ttRows = `<div class="tt-row"><span>${escapeHtml(p.holdingName)}</span><span>${formatPrice(d.holdingPrice)}</span></div>`;
        d.subsidiaries.forEach(function(sub) {
          ttRows += `<div class="tt-row"><span>${escapeHtml(sub.name)}</span><span>${formatRatio(sub.ratio)}</span></div>`;
        });
        ttRows += `<div class="tt-row"><span><strong>총 비율</strong></span><span><strong>${d.ratio.toFixed(2)}%</strong></span></div>`;
      } else {
        ttRows = `<div class="tt-row"><span>${escapeHtml(p.holdingName)}</span><span>${formatPrice(d.holdingPrice)}</span></div>`;
        if (d.subsidiaryPrice) {
          ttRows += `<div class="tt-row"><span>${escapeHtml(p.subsidiaryName)}</span><span>${formatPrice(d.subsidiaryPrice)}</span></div>`;
        }
        ttRows += `<div class="tt-row"><span>보유지분가치</span><span>${formatOk(d.holdingValue)}</span></div>
           <div class="tt-row"><span>조정시가총액</span><span>${formatOk(d.marketCap)}</span></div>
           <div class="tt-row"><span><strong>비율</strong></span><span><strong>${d.ratio.toFixed(2)}%</strong></span></div>`;
      }

      tooltip.innerHTML = `
        <div class="tt-date">${d.date}</div>
        ${ttRows}
      `;

      let tx = dotX + 12;
      let ty = dotY - 80;
      tooltip.style.left = '0px';
      tooltip.style.top = '0px';
      tooltip.classList.add('visible');
      const ttWidth = tooltip.offsetWidth || 210;
      const ttHeight = tooltip.offsetHeight || 80;
      if (tx + ttWidth + 12 > W) tx = dotX - ttWidth - 12;
      ty = dotY - ttHeight - 12;
      if (ty < 0) ty = dotY + 12;
      tooltip.style.left = tx + 'px';
      tooltip.style.top = ty + 'px';
    };
    canvas.onpointerleave = function() {
      tooltip.classList.remove('visible');
    };
  }

  // --- Period buttons ---
  function bindPeriodBtns() {
    document.getElementById('periodBtns').addEventListener('click', function(e) {
      if (e.target.tagName !== 'BUTTON') return;
      this.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      periodDays = parseInt(e.target.dataset.days);
      resetZoomState(ratioZoom);
      renderChart();
      renderStats();
    });
  }

  // --- Price Chart ---
  function renderPriceChart() {
    const p = pairs[selectedIdx];
    const section = document.getElementById('priceChartSection');
    if (p.isAverage) {
      section.style.display = 'none';
      return;
    }
    section.style.display = '';
    document.getElementById('priceChartTitle').textContent = p.holdingName + ' 주가 추이';

    const canvas = document.getElementById('priceChart');
    canvas.setAttribute('aria-label', p.holdingName + ' 주가 추이 선 차트');
    const container = canvas.parentElement;
    const dpr = window.devicePixelRatio || 1;
    const rect = container.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';

    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    const W = rect.width;
    const H = rect.height;

    const baseHist = filterHistoryByDays(p.history, pricePeriodDays);
    updateDataZoom('price', baseHist, priceZoom);
    const hist = applyZoomToHistory(baseHist, priceZoom);
    if (hist.length < 2) {
      ctx.clearRect(0, 0, W, H);
      return;
    }

    const prices = hist.map(h => h.holdingPrice);
    const minP = Math.min(...prices);
    const maxP = Math.max(...prices);
    const chartMin = minP - (maxP - minP) * 0.05;
    const chartMax = maxP + (maxP - minP) * 0.05;
    const rangeP = chartMax - chartMin || 1;

    const pad = { top: 20, right: 16, bottom: 36, left: 80 };
    const cW = W - pad.left - pad.right;
    const cH = H - pad.top - pad.bottom;
    const xs = buildTimeScale(hist, pad.left, cW);
    const colors = getThemeColors();

    ctx.clearRect(0, 0, W, H);

    // Y axis grid
    ctx.strokeStyle = colors.grid;
    ctx.lineWidth = 1;
    const yTicks = 5;
    ctx.font = '12px -apple-system, sans-serif';
    ctx.fillStyle = colors.textDim;
    ctx.textAlign = 'right';
    for (let i = 0; i <= yTicks; i++) {
      const v = chartMin + (rangeP * i / yTicks);
      const y = pad.top + cH - (cH * i / yTicks);
      ctx.beginPath();
      ctx.moveTo(pad.left, y);
      ctx.lineTo(W - pad.right, y);
      ctx.stroke();
      ctx.fillText(Math.round(v).toLocaleString('ko-KR'), pad.left - 8, y + 4);
    }

    // X axis labels (시간 위치 기준)
    ctx.fillStyle = colors.textDim;
    ctx.textAlign = 'center';
    drawTimeAxisLabels(ctx, hist, xs, pad.left, cW, H - pad.bottom + 20);

    // Price change color
    const priceUp = prices[prices.length - 1] >= prices[0];
    const lineColor = priceUp ? colors.up : colors.down;
    const fillStart = priceUp ? colors.priceUpFillStart : colors.priceDownFillStart;
    const fillEnd = priceUp ? colors.priceUpFillEnd : colors.priceDownFillEnd;

    // Gradient fill
    const gradient = ctx.createLinearGradient(0, pad.top, 0, pad.top + cH);
    gradient.addColorStop(0, fillStart);
    gradient.addColorStop(1, fillEnd);

    ctx.beginPath();
    for (let i = 0; i < hist.length; i++) {
      const y = pad.top + cH - ((hist[i].holdingPrice - chartMin) / rangeP * cH);
      if (i === 0) ctx.moveTo(xs[i], y);
      else ctx.lineTo(xs[i], y);
    }
    ctx.lineTo(pad.left + cW, pad.top + cH);
    ctx.lineTo(pad.left, pad.top + cH);
    ctx.closePath();
    ctx.fillStyle = gradient;
    ctx.fill();

    // Line
    ctx.beginPath();
    for (let i = 0; i < hist.length; i++) {
      const y = pad.top + cH - ((hist[i].holdingPrice - chartMin) / rangeP * cH);
      if (i === 0) ctx.moveTo(xs[i], y);
      else ctx.lineTo(xs[i], y);
    }
    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();

    // Tooltip
    const tooltip = document.getElementById('priceTooltip');
    canvas.onpointermove = function(e) {
      const r = canvas.getBoundingClientRect();
      const mx = e.clientX - r.left;
      const my = e.clientY - r.top;
      if (mx < pad.left || mx > W - pad.right || my < pad.top || my > pad.top + cH) {
        tooltip.classList.remove('visible');
        return;
      }
      const idx = nearestIndexForX(xs, mx);
      const d = hist[idx];
      if (!d) return;

      const dotX = xs[idx];
      const dotY = pad.top + cH - ((d.holdingPrice - chartMin) / rangeP * cH);

      const change = idx > 0 ? d.holdingPrice - hist[idx - 1].holdingPrice : 0;
      const changePct = idx > 0 ? (change / hist[idx - 1].holdingPrice * 100) : 0;
      const changeDir = change >= 0 ? 'up' : 'down';
      const arrow = change >= 0 ? '▲' : '▼';

      tooltip.innerHTML = `
        <div class="tt-date">${d.date}</div>
        <div class="tt-row"><span>${escapeHtml(p.holdingName)}</span><span>${formatPrice(d.holdingPrice)}</span></div>
        <div class="tt-row"><span>전일 대비</span><span class="${changeDir}-color">${arrow} ${Math.abs(changePct).toFixed(2)}%</span></div>
      `;

      let tx = dotX + 12;
      let ty = dotY - 60;
      if (tx + 210 > W) tx = dotX - 210;
      if (ty < 0) ty = dotY + 12;
      tooltip.style.left = tx + 'px';
      tooltip.style.top = ty + 'px';
      tooltip.classList.add('visible');
    };
    canvas.onpointerleave = function() {
      tooltip.classList.remove('visible');
    };
  }

  function bindPricePeriodBtns() {
    document.getElementById('pricePeriodBtns').addEventListener('click', function(e) {
      if (e.target.tagName !== 'BUTTON') return;
      this.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      pricePeriodDays = parseInt(e.target.dataset.days);
      resetZoomState(priceZoom);
      renderPriceChart();
    });
  }

  function createZoomState() {
    return { start: 0, end: 1 };
  }

  function resetZoomState(zoom) {
    zoom.start = 0;
    zoom.end = 1;
  }

  // normalizeZoomState·applyZoomToHistory는 js/dashboard-core.js로 이동

  function bindDataZoomControls() {
    ['ratio', 'price'].forEach(function(type) {
      const root = document.getElementById(type + 'DataZoom');
      if (!root) return;
      const track = root.querySelector('.data-zoom-track');
      const selection = root.querySelector('.data-zoom-selection');
      if (!track || !selection) return;

      track.addEventListener('pointerdown', function(e) {
        if (root.classList.contains('disabled')) return;
        const zoom = getZoomState(type);
        normalizeZoomState(zoom);

        const rect = track.getBoundingClientRect();
        const startPoint = clamp((e.clientX - rect.left) / rect.width, 0, 1);
        const targetHandle = e.target && e.target.dataset ? e.target.dataset.handle : '';
        const mode = targetHandle || (selection.contains(e.target) ? 'pan' : 'center');
        const initialStart = zoom.start;
        const initialEnd = zoom.end;
        const span = initialEnd - initialStart;

        selection.classList.add('dragging');
        track.setPointerCapture(e.pointerId);

        const move = function(ev) {
          const point = clamp((ev.clientX - rect.left) / rect.width, 0, 1);
          if (mode === 'start') {
            zoom.start = clamp(point, 0, initialEnd - MIN_ZOOM_SPAN);
          } else if (mode === 'end') {
            zoom.end = clamp(point, initialStart + MIN_ZOOM_SPAN, 1);
          } else {
            const center = mode === 'center' ? point : ((initialStart + initialEnd) / 2) + (point - startPoint);
            zoom.start = clamp(center - span / 2, 0, 1 - span);
            zoom.end = zoom.start + span;
          }
          normalizeZoomState(zoom);
          renderZoomedChart(type);
        };

        const up = function(ev) {
          selection.classList.remove('dragging');
          try {
            track.releasePointerCapture(ev.pointerId);
          } catch (err) {}
          track.removeEventListener('pointermove', move);
          track.removeEventListener('pointerup', up);
          track.removeEventListener('pointercancel', up);
        };

        track.addEventListener('pointermove', move);
        track.addEventListener('pointerup', up);
        track.addEventListener('pointercancel', up);
        move(e);
      });

      track.addEventListener('dblclick', function() {
        resetZoomState(getZoomState(type));
        renderZoomedChart(type);
      });
    });
  }

  function renderZoomedChart(type) {
    if (type === 'ratio') {
      renderChart();
      renderStats();
    } else {
      renderPriceChart();
    }
  }

  function getZoomState(type) {
    return type === 'ratio' ? ratioZoom : priceZoom;
  }

  function updateDataZoom(type, baseHist, zoom) {
    const root = document.getElementById(type + 'DataZoom');
    if (!root) return;
    const selection = root.querySelector('.data-zoom-selection');
    const startLabel = root.querySelector('[data-zoom-start]');
    const summaryLabel = root.querySelector('[data-zoom-summary]');
    const endLabel = root.querySelector('[data-zoom-end]');
    const disabled = !baseHist || baseHist.length < 3;

    root.classList.toggle('disabled', disabled);
    if (disabled) {
      if (selection) {
        selection.style.left = '0%';
        selection.style.width = '100%';
      }
      if (startLabel) startLabel.textContent = '';
      if (summaryLabel) summaryLabel.textContent = '';
      if (endLabel) endLabel.textContent = '';
      return;
    }

    normalizeZoomState(zoom);
    const startPct = zoom.start * 100;
    const endPct = zoom.end * 100;
    const visibleHist = applyZoomToHistory(baseHist, zoom);
    if (selection) {
      selection.style.left = startPct.toFixed(2) + '%';
      selection.style.width = Math.max(0, endPct - startPct).toFixed(2) + '%';
    }
    if (startLabel) startLabel.textContent = visibleHist[0].date;
    if (summaryLabel) {
      const isFull = zoom.start <= 0.001 && zoom.end >= 0.999;
      summaryLabel.textContent = isFull ? '전체 구간' : visibleHist.length.toLocaleString('ko-KR') + '개 포인트';
    }
    if (endLabel) endLabel.textContent = visibleHist[visibleHist.length - 1].date;
  }

  function bindThemeToggle() {
    const toggle = document.getElementById('themeToggle');
    updateThemeButtons();
    if (!toggle) return;
    toggle.addEventListener('click', toggleTheme);
  }

  function toggleTheme() {
    const theme = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
    applyTheme(theme === 'dark' ? 'light' : 'dark', true);
  }

  function getFilteredPriceHistory(pair) {
    return applyZoomToHistory(filterHistoryByDays(pair.history, pricePeriodDays), priceZoom);
  }

  // --- Helpers ---
  // getStackedSubsidiarySeries는 js/dashboard-core.js로 이동

  function getInitialSelectedIdx() {
    if (!initialCode) return 0;
    const normalized = initialCode.toUpperCase();
    const idx = pairs.findIndex(function(pair) {
      if (pair.isAverage) return false;
      const code = resolvePairCode(pair).toUpperCase();
      return code === normalized || pair.id === initialCode;
    });
    return idx >= 0 ? idx : 0;
  }

  function setSelectedIdx(idx, opts) {
    opts = opts || {};
    selectedIdx = idx;
    renderTodayOverview();
    renderCards();
    renderChart();
    renderPriceChart();
    renderStats();
    const selectedPair = pairs[selectedIdx];
    if (selectedPair && (!selectedPair.history || !selectedPair.history.length)) {
      ensureHistory(selectedPair).then(function() {
        if (pairs[selectedIdx] !== selectedPair) return; // 대기 중 선택 변경
        renderChart();
        renderPriceChart();
        renderStats();
      });
    }
    if (opts.syncUrl) syncSelectedCodeToUrl();
    if (opts.scroll) scrollToRatioChart();
  }

  function syncSelectedCodeToUrl() {
    const pair = pairs[selectedIdx];
    const url = new URL(location.href);
    const code = pair ? resolvePairCode(pair) : '';
    if (pair && !pair.isAverage && code) {
      url.searchParams.set('code', code);
    } else {
      url.searchParams.delete('code');
    }
    history.replaceState(null, '', url.toString());
  }

  function scrollToRatioChart() {
    const section = document.getElementById('ratioChartSection');
    if (!section) return;
    section.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function resolveSelectionFromQuery() {
    if (!initialCode) return;
    const idx = findPairIndexByCode(initialCode);
    if (idx >= 0) {
      if (idx !== selectedIdx) {
        setSelectedIdx(idx);
      }
      requestAnimationFrame(function() {
        scrollToRatioChart();
      });
      return;
    }
    loadHoldingCodes().then(function() {
      const resolvedIdx = findPairIndexByCode(initialCode);
      if (resolvedIdx < 0) return;
      setSelectedIdx(resolvedIdx);
      requestAnimationFrame(function() {
        scrollToRatioChart();
      });
    }).catch(function(err) {
      console.warn('종목 코드 매핑 로드 실패:', err);
    });
  }

  function findPairIndexByCode(code) {
    const normalized = (code || '').trim().toUpperCase();
    if (!normalized) return -1;
    return pairs.findIndex(function(pair) {
      if (pair.isAverage) return false;
      return resolvePairCode(pair).toUpperCase() === normalized || pair.id === code;
    });
  }

  function buildHoldingCodeMapFromPairs() {
    const map = {};
    pairs.forEach(function(pair) {
      if (pair.holdingTicker) {
        map[pair.id] = pair.holdingTicker.split('.')[0];
      }
    });
    return map;
  }

  function loadHoldingCodes() {
    if (holdingCodePromise) return holdingCodePromise;
    holdingCodePromise = fetch('config.json')
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(config) {
        config.forEach(function(entry) {
          if (!entry.id || !entry.holdingTicker) return;
          holdingCodeById[entry.id] = entry.holdingTicker.split('.')[0];
        });
        return holdingCodeById;
      });
    return holdingCodePromise;
  }

  function resolvePairCode(pair) {
    if (!pair || pair.isAverage) return '';
    if (pair.holdingTicker) return pair.holdingTicker.split('.')[0];
    return holdingCodeById[pair.id] || '';
  }

  function getFilteredHistory(pair) {
    return applyZoomToHistory(filterHistoryByDays(pair.history, periodDays), ratioZoom);
  }

  // filterHistoryByDays는 js/dashboard-core.js로 이동

  function loadTheme() {
    const urlTheme = new URLSearchParams(location.search).get('theme');
    if (urlTheme === 'dark' || urlTheme === 'light') return urlTheme;
    return localStorage.getItem('theme') || 'light';
  }

  function applyTheme(theme, persist) {
    const nextTheme = theme === 'light' ? 'light' : 'dark';
    document.documentElement.dataset.theme = nextTheme;
    if (persist) localStorage.setItem('theme', nextTheme);
    updateThemeButtons();
    if (hasRendered) {
      renderChart();
      renderPriceChart();
    }
  }

  function updateThemeButtons() {
    const theme = document.documentElement.dataset.theme || 'light';
    const button = document.getElementById('themeToggle');
    if (!button) return;
    button.setAttribute('aria-label', theme === 'dark' ? '일반 모드로 전환' : '다크 모드로 전환');
    button.title = '테마 전환';
  }

  function getThemeColors() {
    const styles = getComputedStyle(document.documentElement);
    return {
      accent: styles.getPropertyValue('--accent').trim(),
      up: styles.getPropertyValue('--up').trim(),
      down: styles.getPropertyValue('--down').trim(),
      text: styles.getPropertyValue('--text').trim(),
      textDim: styles.getPropertyValue('--text-dim').trim(),
      grid: styles.getPropertyValue('--grid').trim(),
      warnLine: styles.getPropertyValue('--warn-line').trim(),
      warnText: styles.getPropertyValue('--warn-text').trim(),
      avgLine: styles.getPropertyValue('--avg-line').trim(),
      avgText: styles.getPropertyValue('--avg-text').trim(),
      smaLine: styles.getPropertyValue('--sma-line').trim(),
      emaLine: styles.getPropertyValue('--ema-line').trim(),
      ratioFillStart: styles.getPropertyValue('--ratio-fill-start').trim(),
      ratioFillEnd: styles.getPropertyValue('--ratio-fill-end').trim(),
      priceUpFillStart: styles.getPropertyValue('--price-up-fill-start').trim(),
      priceUpFillEnd: styles.getPropertyValue('--price-up-fill-end').trim(),
      priceDownFillStart: styles.getPropertyValue('--price-down-fill-start').trim(),
      priceDownFillEnd: styles.getPropertyValue('--price-down-fill-end').trim(),
    };
  }

  function getStackPalette() {
    if ((document.documentElement.dataset.theme || 'dark') === 'light') {
      return ['#2d66d6', '#1f9b57', '#d1433f', '#b7791f', '#7c4dff', '#118ab2'];
    }
    return ['#6c8cff', '#38c96a', '#f0615e', '#f5a623', '#8a63ff', '#4dc7ff'];
  }

  function buildChartLegendItems(series, palette, colors) {
    const items = [];
    if (series && series.length > 1) {
      series.forEach(function(sub, idx) {
        items.push({
          label: sub.name,
          color: palette[idx % palette.length]
        });
      });
      items.push({ label: '총 비율', color: colors.text });
    } else {
      items.push({ label: '비율', color: colors.accent });
    }
    items.push({ label: '기간 평균', color: colors.avgLine });
    items.push({ label: 'SMA 250일', color: colors.smaLine });
    items.push({ label: 'EMA α=0.1', color: colors.emaLine });
    return items;
  }

  function renderChartLegend(items, el) {
    if (!el) return;
    if (!items || items.length === 0) {
      el.innerHTML = '';
      return;
    }
    el.innerHTML = items.map(function(item) {
      return `<span class="chart-legend-item"><span class="legend-swatch" style="background:${item.color}"></span>${item.label}</span>`;
    }).join('');
  }

  function buildRatioTrendLines(fullHist, visibleHist) {
    const hasPrecomputed = visibleHist.some(function(entry) {
      return typeof entry.sma250 === 'number' || typeof entry.ema01 === 'number';
    });

    if (hasPrecomputed) {
      return {
        sma: {
          values: visibleHist.map(function(entry) {
            return typeof entry.sma250 === 'number' ? entry.sma250 : null;
          })
        },
        ema: {
          values: visibleHist.map(function(entry) {
            return typeof entry.ema01 === 'number' ? entry.ema01 : null;
          })
        }
      };
    }

    const alpha = 0.1;
    const smaByDate = new Map();
    const emaByDate = new Map();
    let rollingSum = 0;
    let ema = null;

    fullHist.forEach(function(entry, idx) {
      const ratio = entry.ratio;
      rollingSum += ratio;
      if (idx >= 250) {
        rollingSum -= fullHist[idx - 250].ratio;
      }
      smaByDate.set(entry.date, idx >= 249 ? rollingSum / 250 : null);
      ema = ema === null ? ratio : (alpha * ratio) + ((1 - alpha) * ema);
      emaByDate.set(entry.date, ema);
    });

    return {
      sma: {
        values: visibleHist.map(function(entry) {
          return smaByDate.has(entry.date) ? smaByDate.get(entry.date) : null;
        })
      },
      ema: {
        values: visibleHist.map(function(entry) {
          return emaByDate.has(entry.date) ? emaByDate.get(entry.date) : null;
        })
      }
    };
  }

  function drawSingleRatioChart(ctx, hist, xs, colors, pad, cW, cH, chartMin, rangeS) {
    const gradient = ctx.createLinearGradient(0, pad.top, 0, pad.top + cH);
    gradient.addColorStop(0, colors.ratioFillStart);
    gradient.addColorStop(1, colors.ratioFillEnd);

    ctx.beginPath();
    for (let i = 0; i < hist.length; i++) {
      const y = pad.top + cH - ((hist[i].ratio - chartMin) / rangeS * cH);
      if (i === 0) ctx.moveTo(xs[i], y);
      else ctx.lineTo(xs[i], y);
    }
    const lastX = pad.left + cW;
    ctx.lineTo(lastX, pad.top + cH);
    ctx.lineTo(pad.left, pad.top + cH);
    ctx.closePath();
    ctx.fillStyle = gradient;
    ctx.fill();

    ctx.beginPath();
    for (let i = 0; i < hist.length; i++) {
      const y = pad.top + cH - ((hist[i].ratio - chartMin) / rangeS * cH);
      if (i === 0) ctx.moveTo(xs[i], y);
      else ctx.lineTo(xs[i], y);
    }
    ctx.strokeStyle = colors.accent;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  function drawStackedRatioChart(ctx, hist, xs, series, palette, colors, pad, cW, cH, chartMin, rangeS) {
    let cumulative = new Array(hist.length).fill(0);
    series.forEach(function(sub, subIdx) {
      const color = palette[subIdx % palette.length];
      const nextCumulative = hist.map(function(entry, idx) {
        const contribution = entry.subsidiaries && entry.subsidiaries[subIdx] ? entry.subsidiaries[subIdx].ratio : 0;
        return cumulative[idx] + contribution;
      });

      ctx.beginPath();
      for (let i = 0; i < hist.length; i++) {
        const y = pad.top + cH - ((nextCumulative[i] - chartMin) / rangeS * cH);
        if (i === 0) ctx.moveTo(xs[i], y);
        else ctx.lineTo(xs[i], y);
      }
      for (let i = hist.length - 1; i >= 0; i--) {
        const y = pad.top + cH - ((cumulative[i] - chartMin) / rangeS * cH);
        ctx.lineTo(xs[i], y);
      }
      ctx.closePath();
      ctx.fillStyle = withAlpha(color, 0.22);
      ctx.fill();

      ctx.beginPath();
      for (let i = 0; i < hist.length; i++) {
        const y = pad.top + cH - ((nextCumulative[i] - chartMin) / rangeS * cH);
        if (i === 0) ctx.moveTo(xs[i], y);
        else ctx.lineTo(xs[i], y);
      }
      ctx.strokeStyle = withAlpha(color, 0.9);
      ctx.lineWidth = 1.2;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.stroke();

      cumulative = nextCumulative;
    });

    ctx.beginPath();
    for (let i = 0; i < hist.length; i++) {
      const y = pad.top + cH - ((hist[i].ratio - chartMin) / rangeS * cH);
      if (i === 0) ctx.moveTo(xs[i], y);
      else ctx.lineTo(xs[i], y);
    }
    ctx.strokeStyle = colors.text;
    ctx.lineWidth = 1.5;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  function drawTrendLine(ctx, hist, xs, values, color, pad, cH, chartMin, rangeS, dash, lineWidth) {
    if (!values || values.every(function(value) { return value === null; })) {
      return;
    }

    ctx.save();
    ctx.beginPath();
    let hasStarted = false;
    for (let i = 0; i < hist.length; i++) {
      const value = values[i];
      if (value === null) {
        hasStarted = false;
        continue;
      }
      const y = pad.top + cH - ((value - chartMin) / rangeS * cH);
      if (!hasStarted) {
        ctx.moveTo(xs[i], y);
        hasStarted = true;
      } else {
        ctx.lineTo(xs[i], y);
      }
    }
    ctx.setLineDash(dash || []);
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth || 2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.restore();
  }

  // Resize
  window.addEventListener('resize', () => { renderChart(); renderPriceChart(); });
}
</script>
