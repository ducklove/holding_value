name: Update Holdings API

on:
  push:
    paths:
      - config.json
      - build_holdings_api.py
      - .github/workflows/update-holdings-api.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build holdings API
        run: python build_holdings_api.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet api/holdings.json || {
            git add api/holdings.json
            git commit -m "자동 업데이트: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 지주사 API 갱신"
            for attempt in 1 2 3 4; do
              git pull --rebase origin master && git push && exit 0
              git rebase --abort 2>/dev/null || true
              echo "push retry ${attempt}"
              sleep $((attempt * 2))
            done
            echo "ERROR: push failed after retries" >&2
            exit 1
          }
