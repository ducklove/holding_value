name: CI

on:
  pull_request:
  push:
    paths:
      - '**.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff
      - name: Lint (error classes only)
        run: ruff check --select E9,F .
      - name: Run tests
        run: python -m pytest -q
