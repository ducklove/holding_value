name: CI

on:
  pull_request:
  push:
    paths:
      - '**.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
      - 'js/**'
      - 'tests/js/**'
      # 구조 계약 테스트가 index.html ↔ js/ 짝을 검사하므로 index.html도 트리거에 포함
      - 'index.html'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff
      - name: Lint (error classes only)
        run: ruff check --select E9,F .
      - name: Run tests
        run: python -m pytest -q

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run JS tests
        run: node --test tests/js
