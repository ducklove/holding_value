name: Update Stock Data

on:
  schedule:
    # Daily 05:00 KST refresh.
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: Run a full rebuild instead of the incremental update
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Backup previous data
        uses: actions/upload-artifact@v4
        with:
          name: data-backup-${{ github.run_id }}
          path: data.js
          retention-days: 90
          if-no-files-found: warn

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data
        env:
          FULL_REBUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full_rebuild || 'false' }}
        run: |
          if [ "$FULL_REBUILD" = "true" ]; then
            python fetch_data.py --full
          else
            python fetch_data.py
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js data
          git diff --cached --quiet || {
            git commit -m "자동 업데이트: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 데이터 갱신"
            for attempt in 1 2 3 4; do
              git pull --rebase origin master && git push && exit 0
              git rebase --abort 2>/dev/null || true
              echo "push retry ${attempt}"
              sleep $((attempt * 2))
            done
            echo "ERROR: push failed after retries" >&2
            exit 1
          }
