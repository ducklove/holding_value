name: Update Stock Data

on:
  schedule:
    # Daily 05:00 KST refresh.
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: Run a full rebuild instead of the incremental update
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  issues: write  # 실패 이슈 알림 (fin-commons 표준 헬스 패턴)

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Backup previous data
        uses: actions/upload-artifact@v6
        with:
          name: data-backup-${{ github.run_id }}
          path: data.js
          retention-days: 90
          if-no-files-found: warn

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data
        env:
          FULL_REBUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full_rebuild || 'false' }}
        run: |
          if [ "$FULL_REBUILD" = "true" ]; then
            python fetch_data.py --full
          else
            python fetch_data.py
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js data
          git diff --cached --quiet || {
            git commit -m "자동 업데이트: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 데이터 갱신"
            for attempt in 1 2 3 4; do
              git pull --rebase origin master && git push && exit 0
              git rebase --abort 2>/dev/null || true
              echo "push retry ${attempt}"
              sleep $((attempt * 2))
            done
            echo "ERROR: push failed after retries" >&2
            exit 1
          }

      # --- fin-commons 표준 파이프라인 헬스 블록 ---------------------------
      # ① 실패 → GitHub 이슈 (시크릿 불필요, pip install 실패 시에도 동작)
      - name: Report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create data-update-failure --color D93F0B \
            --description "데이터 갱신 워크플로우 실패" --force || true
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="${{ github.workflow }} 워크플로우가 실패했습니다. 실행 로그: ${run_url}"
          existing=$(gh issue list --label data-update-failure --state open \
            --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "데이터 갱신 실패: ${{ github.workflow }}" \
              --label data-update-failure --body "$body"
          fi

      # ② 실패 → Telegram (일 1회 워크플로우라 스팸 위험 없음)
      - name: Failure alert (fin-commons)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >
          python -m fin_commons.notify_cli
          --context "${{ github.repository }} / ${{ github.workflow }}"
          --detail "일별 히스토리 데이터 갱신 실패"
          --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          || true
