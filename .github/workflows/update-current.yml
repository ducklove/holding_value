name: Update Current Prices

on:
  schedule:
    # Server snapshot safety net every 10 minutes on weekdays.
    # Browser refresh follows common_preferred_spread and refreshes visible tabs every 5 minutes.
    - cron: '2/10 * * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write  # 실패 이슈 알림 (fin-commons 표준 헬스 패턴)

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch current prices
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_TOKEN_PATH: ${{ runner.temp }}/kis_token.json
          KIS_PROXY_REQUEST_INTERVAL: "0.7"
          KIS_PROXY_BASE_URL: ${{ vars.KIS_PROXY_BASE_URL || 'http://cantabile.tplinkdns.com:3288' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fetch_current.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet current.json 2>/dev/null || {
            git add current.json
            git commit -m "Update current prices ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M'))"
            for attempt in 1 2 3 4; do
              git pull --rebase origin master && git push && exit 0
              git rebase --abort 2>/dev/null || true
              echo "push retry ${attempt}"
              sleep $((attempt * 2))
            done
            echo "ERROR: push failed after retries" >&2
            exit 1
          }

      # --- fin-commons 표준 파이프라인 헬스 블록 ---------------------------
      # 10분 주기 고빈도 워크플로우라 Telegram은 생략(스팸 방지), 이슈만 사용.
      # 이슈는 1개에 코멘트로 누적된다.
      - name: Report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create data-update-failure --color D93F0B \
            --description "데이터 갱신 워크플로우 실패" --force || true
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="${{ github.workflow }} 워크플로우가 실패했습니다. 실행 로그: ${run_url}"
          existing=$(gh issue list --label data-update-failure --state open \
            --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "데이터 갱신 실패: ${{ github.workflow }}" \
              --label data-update-failure --body "$body"
          fi
